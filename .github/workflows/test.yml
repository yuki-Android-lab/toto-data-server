name: Scraping Test

on:
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリと本物ブラウザのインストール
        run: |
          python -m pip install --upgrade pip
          pip install Playwright beautifulsoup4
          npx playwright install --with-deps chromium
          
      # ⬇️ ここから書き換え・挿入したステップです ⬇️
      - name: 1. チーム名・順位の取得を実行
        run: |
          python teamRank.py

      - name: 2. 3秒間待機（安全マージン）
        run: |
          sleep 3

      - name: 3. 怪我人情報の追記を実行
        run: |
          python test_scrape.py
