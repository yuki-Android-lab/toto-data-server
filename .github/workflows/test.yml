name: Scraping Test

on:
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリと本物ブラウザのインストール
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: テストスクリプトを実行
        run: |
          python test_scrape.py
