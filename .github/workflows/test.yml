name: Scraping Test

on:
  schedule:
    # 毎週木曜日の日本時間 25:00（金曜AM 1:00）※世界標準時 16:00
    - cron: '0 16 * * 4'
  workflow_dispatch: # 手動でいつでも実行できるようにするボタンを設置

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# 仮想環境に書き込み権限を与える設定（data.jsonの保存に必須）
permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリと本物ブラウザのインストール
        run: |
          python -m pip install --upgrade pip
          pip install Playwright beautifulsoup4
          npx playwright install --with-deps chromium
          
      - name: 1. チーム名・順位の取得を実行
        run: |
          python teamRank.py

      - name: 2. 3秒間待機（安全マージン）
        run: |
          sleep 3

      - name: 3. 怪我人情報の追記を実行
        run: |
          python test_scrape.py

      - name: 3.5 チームコンディションの追記を実行
        run: |
          python teamCondition.py
          
      - name: 3.9 予測計算エンジンの実行
        run: |
          python predict.py
          
      - name: 4. 生成されたdata.jsonをリポジトリに自動コミット・プッシュ
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "🤖 [Automated] data.jsonを更新" || echo "変更なし（コミットをスキップします）"
          git push
          
